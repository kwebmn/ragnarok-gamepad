; uaRO Pad — настройки. Файл лежит рядом с uaRO-1.1.exe.
; Нет ключа или значение неверное — берётся значение по умолчанию. После правки перезапустите клиент.

[general]
enabled = 1             ; 0 — модуль стартует выключенным (включается кнопкой Back)
log_level = info        ; error | info | debug

[stick]
deadzone = 0.25         ; мёртвая зона левого стика (0.05–0.9)
walk_radius = 0.22      ; куда «кликает» ходьба: доля меньшей стороны окна (0.05–0.45)
press = ring            ; ring — ЛКМ сразу в точке ходьбы; center — сначала в центре экрана

[mouse]
freedom = 1             ; 1 — мышь не захватывается, курсор игры идёт за курсором Windows
buttons = dinput        ; dinput | messages — как подавать клиенту нажатие ЛКМ

[target]
give_up_seconds = 4     ; бросить цель, если столько секунд по ней нет ни одного удара
blacklist_seconds = 10  ; столько секунд не выбирать брошенную цель снова
attack_interval_ms = 300

[skills]
ground_self = 12,25,27,70   ; Safety Wall, Pneuma, Warp Portal, Sanctuary — ставить под себя

[rumble]
enabled = 1
